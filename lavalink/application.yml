server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "changeme_use_a_strong_password" # overridden by LAVALINK_SERVER_PASSWORD env var
    sources:
      # Native youtube source is deprecated; the youtube-source plugin below handles it instead.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    oauth:
      enabled: true
      # No refreshToken key here on purpose: an empty string is treated as a real
      # (invalid) token and breaks startup, instead of triggering the device-code
      # flow. Set PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN as an env var once you have a
      # token — see docker-compose.yml, which only passes it through when present.

  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      soundcloud: true
    spotify:
      clientId: ""     # overridden by PLUGINS_LAVASRC_SPOTIFY_CLIENTID env var
      clientSecret: ""  # overridden by PLUGINS_LAVASRC_SPOTIFY_CLIENTSECRET env var
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
