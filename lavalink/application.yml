server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Snapshot, not the 1.18.1 release: fixes a SABR-fallback bug where
    # progressive itag 18 streams get routed to the wrong decoder and fail
    # with "Expected decoding to halt" (fixed upstream in commit e66ec36,
    # included here; not yet in a stable release). Needed together with the
    # remoteCipher config below, which fixes a separate, unrelated issue.
    - dependency: "dev.lavalink.youtube:youtube-plugin:c46ab888ee12bc4bcb37c8ebcaf180e85ae30368"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "changeme_use_a_strong_password" # overridden by LAVALINK_SERVER_PASSWORD env var
    sources:
      # Native youtube source is deprecated; the youtube-source plugin below handles it instead.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      # TV is the only client that actually uses the OAuth token, so it goes
      # first to handle "requires login" videos; the rest are fallbacks for
      # everything else (TV has no search/playlist metadata support on its own).
      - TV
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    oauth:
      enabled: true
      # No refreshToken key here on purpose: an empty string is treated as a real
      # (invalid) token and breaks startup, instead of triggering the device-code
      # flow. Set PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN as an env var once you have a
      # token — see docker-compose.yml, which only passes it through when present.
    remoteCipher:
      # Local signature-cipher parsing breaks every time YouTube tweaks its
      # player script ("Must find sig function") — a maintainer-confirmed dead
      # end (github.com/lavalink-devs/youtube-source/issues/217). This offloads
      # it to the free public yt-cipher instance instead. No password needed;
      # rate-limited to 10 req/s, fine for this bot. Self-host via
      # github.com/kikkia/yt-cipher if that's ever not enough.
      url: "https://cipher.kikkia.dev/"
      userAgent: "music-bot"

  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      soundcloud: true
    spotify:
      clientId: ""     # overridden by PLUGINS_LAVASRC_SPOTIFY_CLIENTID env var
      clientSecret: ""  # overridden by PLUGINS_LAVASRC_SPOTIFY_CLIENTSECRET env var
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
